<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Mood & Weather Score</title>
  <link rel="stylesheet" href="css/style.css"/>
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Inter:wght@300;400;500&display=swap" rel="stylesheet"/>
</head>
<body>
  <div class="bg-grid"></div>

  <main class="container">
    <header class="header">
      <span class="badge">LIVE</span>
      <h1>Mood<span class="accent">&</span>Weather</h1>
      <p class="subtitle">Tu estado de ánimo + el clima real de tu ciudad = tu score del día</p>
    </header>

    <section class="card form-card">
      <div class="form-group">
        <label>¿Quién eres?</label>
        <select id="usuario-select">
          <option value="">Cargando usuarios...</option>
        </select>
      </div>

      <div class="form-group">
        <label>¿Cómo te sientes hoy? <span id="mood-value" class="mood-num">5</span></label>
        <input type="range" id="mood-slider" min="1" max="10" value="5"/>
        <div class="mood-labels">
          <span><i data-lucide="frown"></i> Fatal</span>
          <span><i data-lucide="meh"></i> Meh</span>
          <span><i data-lucide="smile"></i> Excelente</span>
        </div>
      </div>

      <button id="btn-registrar" class="btn-primary">
        <span class="btn-text">Registrar score</span>
        <span class="btn-loader" hidden>Calculando...</span>
      </button>
    </section>

    <section id="resultado" class="card resultado-card" hidden>
      <div class="resultado-top">
        <div class="score-circle">
          <span id="res-score">--</span>
          <small>pts</small>
        </div>
        <div class="resultado-info">
          <h2 id="res-nombre">--</h2>
          <p id="res-ciudad">
            <i data-lucide="map-pin"></i>
            <span id="res-ciudad-text">--</span>
          </p>
          <p id="res-clima-p">
            <i data-lucide="cloud-sun"></i>
            <span id="res-clima">--</span>
          </p>
          <p id="res-temp-p">
            <i data-lucide="thermometer"></i>
            <span id="res-temp">--</span>
          </p>
        </div>
      </div>
      <div class="score-bar-wrap">
        <div class="score-bar">
          <div id="score-fill" class="score-fill"></div>
        </div>
        <div class="score-labels">
          <span>0</span><span>60</span><span>120</span>
        </div>
      </div>
    </section>

    <div class="nav-link">
      <a href="reports.html">Ver reportes <i data-lucide="arrow-right"></i></a>
    </div>
  </main>

  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="js/app.js"></script>
  <script>lucide.createIcons();</script>
</body>
</html>
